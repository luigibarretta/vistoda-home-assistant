name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  real-home-assistant:
    name: Real Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.0", "2026.9.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install native camera support
        # Ubuntu 24.04 calls this runtime package libturbojpeg; Debian uses
        # libturbojpeg0. GitHub-hosted runners are Ubuntu.
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libturbojpeg
      - name: Install exact Home Assistant and its relevant platform requirements
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          python -m pip install ".[dev]" "homeassistant==${HA_VERSION}"
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          import homeassistant
          root = Path(homeassistant.__file__).parent / "components"
          requirements = set()
          for platform in ("camera", "stream", "frontend", "ring"):
              manifest = json.loads((root / platform / "manifest.json").read_text())
              requirements.update(manifest.get("requirements", []))
          subprocess.run([sys.executable, "-m", "pip", "install", *sorted(requirements)], check=True)
          PY
      - name: Exercise real imports, setup/unload, registry migration and config flow
        run: python -m pytest -q tests_real_ha

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q custom_components tests scripts
      - run: python scripts/check_loc.py
      - run: python -m pytest
      - run: node --test tests/*.mjs
  browser-engines:
    name: Browser ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install pinned browser harness
        run: npm install --no-save --package-lock=false playwright@1.61.1
      - name: Install ${{ matrix.engine }} browser
        run: npx playwright install --with-deps "${{ matrix.engine }}"
      - name: Exercise responsive and accessible panel flows
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/browser/panel-responsive.mjs
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
