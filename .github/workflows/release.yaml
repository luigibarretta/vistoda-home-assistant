name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yaml

  release:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release tag and component quality
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/media_bridge/manifest.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          python -m pip install ".[dev]"
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          node --test tests/*.mjs
      - name: Publish HACS release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --generate-notes
