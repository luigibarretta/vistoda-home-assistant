name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pip==26.2.2
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q custom_components tests scripts
      - run: python scripts/check_loc.py
      - run: python -m pytest
      - run: node --test tests/*.mjs
  secret-scan:
    # Mirrors the GitHub secret-scan job. It runs the gitleaks binary directly so
    # the scan does not depend on GitHub's API; version and checksum are pinned.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
      - name: Scan the full history for secrets
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .
